general {
    lock_cmd = pidof hyprlock || hyprlock # avoid starting multiple instances of hyprlock
    before_sleed_cmd = loginctl lock-session # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on # avoid having to press a key twice to turn on the screen
}
listener {
    timeout = 180 # 3 min
    on-timeout = hyprctl dispatch dpms off # Set screen brightness to minimum
    on-resume = hyprctl dispatch dpms on # restore screen brightness
}

listener {
    timeout = 300 # 5 min
    on-timeout = loginctl lock-session # lock screen
}

listener {
    timeout = 1800 # 30 min
    on-timeout = systemctl suspend # suspend the pc
}
